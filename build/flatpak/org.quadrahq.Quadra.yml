id: org.quadrahq.Quadra
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm23

command: quadra

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /share/doc
  - /share/man

modules:
  - name: openxr-loader
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/libopenxr_loader.so
    sources:
      - type: git
        url: https://github.com/KhronosGroup/OpenXR-SDK.git
        tag: release-1.1.65
        commit: 24a1f2b92d212501a2b1b8d30ffd53abf55fcfa8

  - name: cjson
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DENABLE_CJSON_TEST=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/libcjson.so
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.19
        commit: c859b25da02955fef659d658b8f324b5cde87be3

  - name: quadra
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm23/bin
      env:
        CARGO_HOME: /run/build/quadra/cargo
        CC: clang
        CXX: clang++
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold
    build-commands:
      - |
        export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,/app/lib64 -C link-arg=-Wl,-rpath,/app/lib"
        cargo --offline build --release --locked --workspace
      - install -Dm755 target/release/quadra -t /app/bin/
      - install -Dm755 target/release/quadra-web-window -t /app/bin/
      - install -Dm644 LICENSE -t /app/share/licenses/quadra/
      - mkdir -p /app/share/icons && cp -r data/icons/hicolor /app/share/icons/
      - install -Dm644 build/flatpak/org.quadrahq.Quadra.desktop -t /app/share/applications/
      - install -Dm644 data/org.quadrahq.Quadra.xml -t /app/share/mime/packages/
      - install -Dm644 build/flatpak/org.quadrahq.Quadra.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - flatpak_app
          - repo
      - cargo-sources.json
