name: Nix packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flake.*'
      - 'packaging/nix/**'
      - 'packaging/install-payload.sh'
      - 'packaging/release.json'
      - 'launcher/**'
      - 'darling/**'
      - 'vr/**'
      - 'rosemary/**'
      - 'flatpak/darling-noroot.c'
      - 'flatpak/launchd_pid1.c'
      - '*.sh'
      - '.github/workflows/nix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the CiderDarling, regular Darling and Rosemary packages
        run: nix flake check --print-build-logs
      - name: Check each runtime in a disposable prefix
        run: |
          nix run .#check-runtime
          nix run .#check-runtime-regular
          nix run .#check-runtime-rosemary
