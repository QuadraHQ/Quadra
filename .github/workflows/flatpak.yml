name: Flatpak

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-sources:
    name: Update cargo-sources.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FLATPAK_BUILDER_TOOLS_COMMIT: 9d86d336a39b9af38b86f114b6ce5820fe260f91
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether Cargo.toml or Cargo.lock changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- Cargo.toml Cargo.lock; then
            echo "cargo=false" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.cargo == 'true'
        with:
          python-version: "3.13"

      - name: Generate cargo-sources.json
        if: steps.changes.outputs.cargo == 'true'
        run: |
          tools="$RUNNER_TEMP/flatpak-builder-tools"
          git clone --quiet --filter=blob:none https://github.com/flatpak/flatpak-builder-tools.git "$tools"
          git -C "$tools" checkout --quiet "$FLATPAK_BUILDER_TOOLS_COMMIT"
          pip install "aiohttp>=3.9.5,<4" "PyYAML>=6.0.2,<7" "tomlkit>=0.13.3,<1"
          python "$tools/cargo/flatpak-cargo-generator.py" Cargo.lock -o flatpak/cargo-sources.json

      - name: Commit cargo-sources.json
        if: steps.changes.outputs.cargo == 'true'
        run: |
          if git diff --quiet -- flatpak/cargo-sources.json; then
            echo "cargo-sources.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flatpak: update cargo-sources.json" -- flatpak/cargo-sources.json
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: flatpak/cargo-sources.json

  flatpak:
    name: Build Flatpak
    needs: cargo-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cargo-sources
          path: flatpak

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: quadra.flatpak
          manifest-path: flatpak/org.quadrahq.Quadra.yml
          cache-key: flatpak-builder-${{ github.sha }}
