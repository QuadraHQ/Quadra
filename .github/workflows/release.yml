name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Create release
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="v$version"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists, bump the version in Cargo.toml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes from commit logs
        run: |
          if previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2> /dev/null)"; then
            range="$previous_tag..HEAD"
          else
            range="HEAD"
          fi
          git log --no-merges --pretty='- %s (%h)' "$range" > release-notes.md
          cat release-notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --prerelease="$PRERELEASE"
