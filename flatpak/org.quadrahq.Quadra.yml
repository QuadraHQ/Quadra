id: org.quadrahq.Quadra
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: quadra-rewrite

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-data/butter/runners:ro
  - --filesystem=~/.var/app/io.github.microlift.butter/data/butter/runners:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /share/doc
  - /share/man

modules:
  - name: quadra-rewrite
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/quadra-rewrite/cargo
    build-commands:
      - |
        export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,/app/lib64 -C link-arg=-Wl,-rpath,/app/lib"
        cargo --offline build --release --locked
      - install -Dm755 target/release/quadra-rewrite -t /app/bin/
      - install -Dm644 data/icons/org.quadrahq.Quadra.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 flatpak/org.quadrahq.Quadra.desktop -t /app/share/applications/
      - install -Dm644 data/org.quadrahq.Quadra.xml -t /app/share/mime/packages/
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - flatpak_app
          - repo
      - cargo-sources.json
