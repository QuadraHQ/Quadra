id: org.quadrahq.Quadra
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm23

command: quadra

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /share/doc
  - /share/man

modules:
  - name: quadra
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm23/bin
      env:
        CARGO_HOME: /run/build/quadra/cargo
        CC: clang
        CXX: clang++
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold
    build-commands:
      - |
        export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,/app/lib64 -C link-arg=-Wl,-rpath,/app/lib"
        cargo --offline build --release --locked
      - install -Dm755 target/release/quadra -t /app/bin/
      - mkdir -p /app/share/icons && cp -r data/icons/hicolor /app/share/icons/
      - install -Dm644 flatpak/org.quadrahq.Quadra.desktop -t /app/share/applications/
      - install -Dm644 data/org.quadrahq.Quadra.xml -t /app/share/mime/packages/
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - flatpak_app
          - repo
      - cargo-sources.json
