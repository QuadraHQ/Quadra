id: org.quadrahq.Quadra
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: quadra

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /share/doc
  - /share/man

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192

  - name: quadra
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/quadra/cargo
    build-commands:
      - |
        export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,/app/lib64 -C link-arg=-Wl,-rpath,/app/lib"
        cargo --offline build --release --locked
      - install -Dm755 target/release/quadra -t /app/bin/
      - install -Dm644 LICENSE -t /app/share/licenses/quadra/
      - mkdir -p /app/share/icons && cp -r data/icons/hicolor /app/share/icons/
      - install -Dm644 flatpak/org.quadrahq.Quadra.desktop -t /app/share/applications/
      - install -Dm644 data/org.quadrahq.Quadra.xml -t /app/share/mime/packages/
      - install -Dm644 flatpak/org.quadrahq.Quadra.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - flatpak_app
          - repo
      - cargo-sources.json
