[package]
name = "quadra-web-window"
version = "0.52.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
soup = { version = "0.9", package = "soup3" }
webkit = { version = "0.6.1", package = "webkit6", features = ["v2_46"] }
