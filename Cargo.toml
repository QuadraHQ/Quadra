[package]
name = "quadra-rewrite"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
flate2 = "1.1.10"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.0"
ureq = { version = "3.5.1", features = ["json"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
